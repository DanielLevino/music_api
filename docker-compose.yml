services:
    app:
        build: .
        image: maven:3.9.6-eclipse-temurin-21
        volumes:
            - .:/app
        working_dir: /app
        ports:
            - "8080:8080"
            - "5005:5005"
        command: >
            mvn spring-boot:run
            -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
        depends_on:
            - db
        develop:
            watch:
                - action: sync
                  path: ./target/classes
                  target: /app/target/classes
                - action: rebuild
                  path: ./pom.xml

    db:
        image: postgres:16
        environment:
            POSTGRES_USER: daniel
            POSTGRES_PASSWORD: 123
            POSTGRES_DB: musicapp_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: